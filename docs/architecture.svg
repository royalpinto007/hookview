<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="290" viewBox="0 0 1100 290" role="img" aria-labelledby="title desc"><title id="title">hookview architecture</title><desc id="desc">Mint accounts, hook programs and optional account requirements are read from public RPC and decoded locally. No transactions are sent.</desc><rect width="1100" height="290" rx="16" fill="#101113"/><g font-family="system-ui,sans-serif"><text x="36" y="48" font-size="23" fill="#e6e8e9">hookview / read-only by design</text><g fill="#1a1c1f" stroke="#454a50"><rect x="36" y="100" width="210" height="92" rx="10"/><rect x="300" y="100" width="210" height="92" rx="10"/><rect x="564" y="100" width="210" height="92" rx="10"/><rect x="828" y="100" width="236" height="92" rx="10"/></g><g fill="#edce8a" font-size="24"><text x="265" y="153">→</text><text x="529" y="153">→</text><text x="793" y="153">→</text></g><g fill="#e6e8e9" font-size="17"><text x="56" y="140">Token mint</text><text x="320" y="140">Public Solana RPC</text><text x="584" y="140">Account decoders</text><text x="848" y="140">Local dashboard</text></g><g fill="#a9afb6" font-size="13"><text x="56" y="168">Mainnet / Devnet</text><text x="320" y="168">Confirmed account reads</text><text x="584" y="168">Hook + extra-account PDA</text><text x="848" y="168">CLI / JSON / Markdown</text><text x="36" y="245">No wallet or transactions. Custom program behavior is not inferred.</text></g></g></svg>
